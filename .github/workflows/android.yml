name: Android Sync and Release

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['README.md', 'docs/**']

permissions:
  contents: read
concurrency:
  group: android-sync-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      build: ${{ steps.release.outputs.build }}
      notify: ${{ steps.release.outputs.notify }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}
      - name: Sync upstream
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          UPSTREAM_REPOSITORY: ${{ vars.UPSTREAM_REPOSITORY || 'YXBwbWFya2V0/AppMarket' }}
          UPSTREAM_BRANCH: ${{ vars.UPSTREAM_BRANCH || 'main' }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git check-ref-format --branch "$UPSTREAM_BRANCH"
          [[ "$UPSTREAM_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags "https://github.com/$UPSTREAM_REPOSITORY.git" "$UPSTREAM_BRANCH"
          upstream_sha=$(git rev-parse FETCH_HEAD)
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo 'Upstream is already synced.'
            exit 0
          fi
          # Support the first sync of this repository's single-commit import.
          # Preserve this fork's CI rather than adopting upstream's release workflow.
          git show HEAD:.github/workflows/android.yml > "$RUNNER_TEMP/android.yml"
          if ! git merge --no-commit --no-ff --allow-unrelated-histories "$upstream_sha"; then
            conflicts=$(git diff --name-only --diff-filter=U)
            if [[ "$conflicts" != '.github/workflows/android.yml' ]]; then
              git merge --abort
              echo '::error::Upstream conflicts require manual resolution; nothing was pushed.'
              exit 1
            fi
          fi
          cp "$RUNNER_TEMP/android.yml" .github/workflows/android.yml
          git add .github/workflows/android.yml
          git commit -m "chore: sync upstream $upstream_sha"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
      - name: Check release
        id: release
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const {execFileSync} = require('node:child_process');
            const sha = execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
            const tag = context.ref.startsWith('refs/tags/')
              ? context.ref.slice('refs/tags/'.length) : `auto-${sha}`;
            let build = true;
            let notify = true;
            try {
              const {data} = await github.rest.repos.getReleaseByTag({...context.repo, tag});
              build = data.draft || !data.assets.some(asset => asset.name.endsWith('.apk'));
              notify = !(data.body || '').includes('<!-- telegram-notified -->');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput('sha', sha);
            core.setOutput('tag', tag);
            core.setOutput('build', String(build));
            core.setOutput('notify', String(notify));

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Decode and validate signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS || 'sakura' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGNING_KEY KEYSTORE_PASS KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$SIGNING_KEY" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          keytool -list -keystore "$RUNNER_TEMP/keystore.jks" -storepass:env KEYSTORE_PASS -alias "$KEY_ALIAS" > /dev/null
      - name: Build signed APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS || 'sakura' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:android:assembleRelease --no-daemon
          mkdir -p release-assets
          mapfile -d '' apks < <(find app/android/build/outputs/apk/release -name '*.apk' -print0)
          (( ${#apks[@]} > 0 )) || { echo '::error::No release APK produced'; exit 1; }
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify "$apk"
            cp "$apk" release-assets/
          done
          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: signed-release-apk
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" --title "AppMarket $RELEASE_TAG" --generate-notes --draft
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
          echo "Release: https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore.jks"

  telegram:
    needs: [prepare, build]
    if: always() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') && needs.prepare.outputs.notify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Download published APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release download "$RELEASE_TAG" --pattern '*.apk' --dir release-assets
      - name: Notify Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '-1002297341668' }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
        run: python3 scripts/notify_telegram.py
      - name: Record successful notification
        uses: actions/github-script@v9.0.0
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        with:
          script: |
            const {data} = await github.rest.repos.getReleaseByTag({...context.repo, tag: process.env.RELEASE_TAG});
            const marker = '<!-- telegram-notified -->';
            if (!(data.body || '').includes(marker)) {
              await github.rest.repos.updateRelease({...context.repo, release_id: data.id, body: `${data.body || ''}\n\n${marker}`});
            }
